# Ayurvidya RAG settings. Any key can be overridden with an environment variable AYV_<KEY>,
# e.g.  AYV_LLM=anthropic:claude-sonnet-5-5   AYV_EMBEDDER=st:BAAI/bge-m3
data_dir: data
kb_dir: data/kb
prompts_dir: prompts
db_path: data/ayurvidya.sqlite3

embedder: tfidf            # tfidf (offline) | st:BAAI/bge-m3 | st:Qwen/Qwen3-Embedding-0.6B
vector_store: numpy        # numpy (exact) | chroma
reranker: ""               # "" | bge:BAAI/bge-reranker-v2-m3

dense_k: 20
sparse_k: 20
rrf_k: 60
final_k: 6

llm: mock                  # mock | anthropic:claude-sonnet-5-5 | openai:qwen2.5:14b (with llm_base_url)
llm_base_url: ""           # e.g. http://localhost:11434/v1 for Ollama
temperature: 0.0
max_tokens: 2000
max_retries: 2
