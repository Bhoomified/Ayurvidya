<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11152e">
  <meta name="description" content="Study Sushruta Samhita, Nidana Sthana 1, verse by verse through the 7 Ayurvidya steps">
  <title>Ayurvidya</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <script>try { const t = localStorage.getItem("ayv.theme"); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
</head>
<body>
  <div class="glow" aria-hidden="true"><span></span><span></span></div>

  <aside class="sidebar" aria-label="Main">
    <a class="logo" href="#/">
      <img src="icon.svg" alt="" width="36" height="36">
      <span><b>Ayurvidya</b><small class="deva">आयुर्विद्या</small></span>
    </a>
    <nav class="nav">
      <a href="#/" data-nav="home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>Dashboard</a>
      <a href="#/verses" data-nav="verses"><svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5zM8 9h8M8 13h8M8 17h5"/></svg>All verses</a>
      <a href="#/study" data-nav="study"><svg viewBox="0 0 24 24"><path d="M4 6l8-3 8 3-8 3zM7 8v5c0 2 2.5 3.5 5 3.5s5-1.5 5-3.5V8M20 6v6"/></svg>Study</a>
      <a href="#/ask" data-nav="ask"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z M8 9h8M8 12h5"/></svg>Ask AI</a>
    </nav>
    <div class="side-foot">
      <div class="side-chapter"><span class="deva">वातव्याधिनिदानम्</span><small>Sushruta Samhita, Nidana Sthana 1</small></div>
      <button class="theme-btn" id="theme" aria-label="Switch light or dark theme">
        <svg viewBox="0 0 24 24" class="moon"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
        <svg viewBox="0 0 24 24" class="sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span>Theme</span>
      </button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="back" id="back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="titles"><h1 id="pageTitle">Dashboard</h1><p id="pageSub"></p></div>
      <form class="jump" id="jump" role="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
        <input id="jumpIn" type="search" placeholder="Jump to verse… e.g. 13" aria-label="Jump to a verse number" inputmode="numeric">
      </form>
    </header>
    <main id="view" class="view" aria-live="polite"></main>
  </div>

  <nav class="tabbar" aria-label="Main">
    <a href="#/" data-nav="home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>Home</a>
    <a href="#/verses" data-nav="verses"><svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5zM8 9h8M8 13h8M8 17h5"/></svg>Verses</a>
    <a href="#/study" data-nav="study"><svg viewBox="0 0 24 24"><path d="M4 6l8-3 8 3-8 3zM7 8v5c0 2 2.5 3.5 5 3.5s5-1.5 5-3.5V8"/></svg>Study</a>
    <a href="#/ask" data-nav="ask"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>Ask AI</a>
